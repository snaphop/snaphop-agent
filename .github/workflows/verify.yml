name: Verify

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: scripts/check.sh
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14
      BUILD_JOBS: 2
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-14 g++-14 cmake libcurl4-openssl-dev python3 cppcheck
      - name: Install pinned Trivy
        run: scripts/install-trivy.sh
      - name: Build and test
        run: scripts/check.sh
      - name: Upload static analysis report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-analysis
          path: build/static-analysis/cppcheck.log
          if-no-files-found: warn
          retention-days: 7

  coverage:
    name: Local coverage suite
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14
      GCOV: gcov-14
      BUILD_JOBS: 2
      PYTHON: .venv-coverage/bin/python
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build and coverage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 cmake libcurl4-openssl-dev python3-venv
          python3 -m venv .venv-coverage
          .venv-coverage/bin/python -m pip install -r scripts/requirements-coverage.txt
      - name: Build, test and measure all project C++ sources
        run: scripts/coverage.sh
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: build-coverage/coverage/
          if-no-files-found: warn
          retention-days: 7
